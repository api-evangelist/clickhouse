            type: string
          example:
          - us-east-1a
          - us-east-1b
          - us-east-1c
        isByoVpc:
          description: True when the infrastructure runs in a customer-provided VPC (BYO-VPC) instead of a ClickHouse-managed one
          type: boolean
        byoVpcId:
          description: Customer VPC ID or network name (BYO-VPC only)
          type: string
          example: vpc-0abc1234def567890
        byoVpcPrivateSubnetIds:
          type: array
          description: Customer private subnet IDs or names (BYO-VPC only; exactly one entry on GCP)
          items:
            type: string
        byoVpcPodCidrRangeNames:
          type: array
          description: Secondary IP range names pinned for pod IPs (GCP BYO-VPC only). Absent when all secondary ranges are used
          items:
            type: string
        byoVpcSharedVpcHostProjectId:
          description: Shared VPC host project owning the VPC and subnet (GCP BYO-VPC only). Absent when the VPC lives in the service project
          type: string
        gcpPscSubnetId:
          description: Customer-provided Private Service Connect NAT subnet name configured for private link (GCP BYO-VPC only)
          type: string
    ByocInfrastructurePatchRequest:
      properties:
        displayName:
          description: Human readable name for infrastructure object
          type: string
        enablePrivateLink:
          description: Enable or disable private link connectivity on the infrastructure. Disabling is rejected while any service in the organization has active private endpoints
          type: boolean
        gcpPscSubnetId:
          description: 'GCP BYO-VPC only: customer-provided Private Service Connect NAT subnet name required to enable private link. Only accepted together with `enablePrivateLink: true`'
          type: string
        enablePrivateLoadBalancer:
          description: Enable or disable the private (internal) load balancer of the infrastructure
          type: boolean
        enablePublicLoadBalancer:
          description: Enable or disable the public (internet-facing) load balancer of the infrastructure
          type: boolean
        tags:
          $ref: '#/components/schemas/ByocInfrastructureTags'
    ByocInfrastructureProgressStage:
      properties:
        name:
          description: Name of the provisioning stage or resource
          type: string
          example: vpc
        status:
          description: Status of this stage
          type: string
          enum:
          - not_started
          - pending
          - waiting
          - in_progress
          - ready
          - failed
          example: ready
        updatedAt:
          description: Timestamp the stage status last changed. ISO-8601
          type: string
          format: date-time
        message:
          description: Human readable detail for the current status, e.g. an error message
          type: string
        subStages:
          type: array
          description: Nested stages; leaf entries are individual cloud resources
          items:
            $ref: '#/components/schemas/ByocInfrastructureProgressStage'
    OrganizationPatchRequest:
      properties:
        name:
          description: Name of the organization.
          type: string
        privateEndpoints:
          $ref: '#/components/schemas/OrganizationPrivateEndpointsPatch'
        enableCoreDumps:
          description: Whether crash reports (core dumps) collection is enabled for services in the organization. When disabled at the organization level, individual services cannot enable crash reports.
          type: boolean
    OrganizationQuota:
      properties:
        quotaCode:
          description: Stable identifier of the quota. Use it to request a single quota by code.
          type: string
          enum:
          - services-per-organization
          - postgres-services-per-organization
          - replicas-per-warehouse
          - api-keys-per-organization
          example: services-per-organization
        name:
          description: Human-readable name of the quota.
          type: string
          example: Services per organization
        description:
          description: Explanation of the resource the quota limits and how the limit is applied.
          type: string
        scope:
          description: Granularity at which the limit is applied. For example, `replicas-per-warehouse` is an organization-wide setting that limits each warehouse individually.
          type: string
          enum:
          - organization
          - warehouse
          example: organization
        value:
          description: Limit currently applied to the organization, including any adjustments made for the organization. The value can change when the billing status of the organization changes.
          type: integer
          minimum: 0
          example: 20
        usage:
          description: Current consumption of the quota. Omitted for quotas that do not report usage. Usage can exceed `value` when a limit was lowered after resources were created; existing resources are not affected.
          type: integer
          minimum: 0
          example: 3
        adjustable:
          description: Whether the limit can be raised for the organization by contacting ClickHouse support.
          type: boolean
      required:
      - quotaCode
      - name
      - description
      - scope
      - value
      - adjustable
    ByocInfrastructureProgress:
      properties:
        id:
          description: Unique identifier of the BYOC infrastructure
          type: string
        status:
          description: Overall provisioning status of the infrastructure
          type: string
          enum:
          - not_started
          - pending
          - waiting
          - in_progress
          - ready
          - failed
          example: in_progress
        updatedAt:
          description: Timestamp the overall status last changed. ISO-8601
          type: string
          format: date-time
        stages:
          type: array
          description: Top-level provisioning stages with their nested resources
          items:
            $ref: '#/components/schemas/ByocInfrastructureProgressStage'
    Organization:
      properties:
        id:
          description: Unique organization ID.
          type: string
          format: uuid
        createdAt:
          description: The timestamp the organization was created. ISO-8601.
          type: string
          format: date-time
        name:
          description: Name of the organization.
          type: string
        privateEndpoints:
          type: array
          description: List of private endpoints for organization
          items:
            $ref: '#/components/schemas/OrganizationPrivateEndpoint'
        byocConfig:
          type: array
          description: BYOC configuration for the organization
          items:
            $ref: '#/components/schemas/ByocConfig'
        enableCoreDumps:
          description: Whether crash reports (core dumps) collection is enabled for services in the organization. When disabled at the organization level, individual services cannot enable crash reports.
          type: boolean
        capabilities:
          $ref: '#/components/schemas/OrganizationCapabilities'
    ByocInfrastructureTagsResponse:
      properties:
        tags:
          $ref: '#/components/schemas/ByocInfrastructureTags'
      required:
      - tags
    ByocInfrastructurePostRequest:
      properties:
        regionId:
          description: Region in which the BYOC infrastructure will be located
          type: string
          enum:
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - ap-southeast-1
          - ap-southeast-2
          - ca-central-1
          - eu-central-1
          - eu-west-1
          - eu-west-2
          - il-central-1
          - us-east-1
          - us-east-2
          - us-west-2
          - us-east1
          - us-central1
          - europe-west2
          - europe-west4
          - asia-southeast1
          - asia-northeast1
          - eastus
          - eastus2
          - westus3
          - germanywestcentral
          - centralus
        accountId:
          description: 'Cloud account ID the BYOC infrastructure is configured for: AWS account ID, GCP project ID, or Azure subscription ID'
          type: string
          example: '123456789012'
        availabilityZoneSuffixes:
          type: array
          description: List of availability zone suffixes
          items:
            type: string
            enum:
            - a
            - b
            - c
            - d
            - e
            - f
        vpcCidrRange:
          description: CIDR range for the ClickHouse-managed VPC. Mutually exclusive with the BYO-VPC fields (`vpcId`, `privateSubnetIds`, `publicSubnetIds`)
          type: string
          example: 10.0.0.0/16
        externalId:
          description: 'AWS only: ExternalID baked into the ClickHouse management role trust policy in your account'
          type: string
          example: ch-0a1b2c3d4e5f6789
        tenantId:
          description: 'Azure only (required for Azure regions): Entra tenant ID of the subscription'
          type: string
        servicePrincipalClientId:
          description: 'Azure only (required for Azure regions): client ID of the service principal ClickHouse uses to manage the infrastructure'
          type: string
        vpcId:
          description: 'BYO-VPC only (AWS and GCP): ID or network name of the customer-provided VPC to deploy into. Requires `privateSubnetIds`'
          type: string
          example: vpc-0abc1234def567890
        privateSubnetIds:
          type: array
          description: 'BYO-VPC only: private subnet IDs or names (1-6 entries on AWS, exactly one on GCP)'
          items:
            type: string
        publicSubnetIds:
          type: array
          description: 'AWS BYO-VPC only: public subnet IDs (at most 6 entries)'
          items:
            type: string
        gcpPodCidrRangeNames:
          type: array
          description: 'GCP BYO-VPC only: secondary IP range names on the subnet to use for pod IPs. Omitted: all secondary ranges are used'
          items:
            type: string
        gcpSharedVpcHostProjectId:
          description: 'GCP BYO-VPC only: Shared VPC host project owning the VPC and subnet, when different from `accountId`'
          type: string
        tags:
          $ref: '#/components/schemas/ByocInfrastructureTags'
        displayName:
          description: Human readable name for infrastructure
          type: string
      required:
      - regionId
      - accountId
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'
      x-permission-scopes: The scope list of a `security` requirement holds ClickHouse Cloud API key permission ids (for example `control-plane:organization:view`), not OAuth scopes. OpenAPI has no field for API key permissions, so this is the closest available place. A key must hold every permission listed on an operation to call it; an operation with no scopes needs none beyond a valid key. Every operation declares at most one requirement object, always for this scheme, so the list is only ever conjunctive — alternative sets of permissions are never expressed.

        type:
          description: Inferred ClickHouse data type of the field.
          type: string
          example: Int64
        optional:
          description: Whether the field is optional (nullable) in the source.
          type:
          - boolean
          - 'null'
    CreateReversePrivateEndpoint:
      properties:
        description:

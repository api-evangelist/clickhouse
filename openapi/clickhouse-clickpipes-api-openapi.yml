components:
  schemas:
    ClickPipePubSubSource:
      properties:
        format:
          description: Format of messages in the Pub/Sub topic. GCP Pub/Sub ClickPipes are in limited preview — contact support to enable this feature for your organization.
          type: string
          enum:
          - JSONEachRow
          - Avro
          - Protobuf
          example: JSONEachRow
        projectId:
          description: GCP project ID that owns the Pub/Sub topic.
          type: string
          example: my-gcp-project
        topic:
          description: Pub/Sub topic name (not the fully-qualified path).
          type: string
          example: my-topic
        authentication:
          description: Authentication method to use with GCP Pub/Sub. SERVICE_ACCOUNT_WORKLOAD_IDENTITY is in Private Preview. ClickPipes uses the GCP service account returned in gcpWorkloadIdentity.principal by the operation with operationId clickPipesServiceContextGet; grant it access to the source resources.
          type: string
          enum:
          - SERVICE_ACCOUNT
          - SERVICE_ACCOUNT_WORKLOAD_IDENTITY
          example: SERVICE_ACCOUNT
        seekType:
          description: Starting position strategy for consuming the subscription. The seekTimestamp companion is required only when seekType is "timestamp"; setting it for a mismatched seek type is rejected.
          type: string
          enum:
          - latest
          - earliest
          - timestamp
          example: earliest
        seekTimestamp:
          description: RFC 3339 / ISO 8601 timestamp to seek to. Required when seekType is "timestamp"; must be omitted otherwise.
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-04-10T12:00:00Z'
        filter:
          description: Optional Pub/Sub subscription filter expression (CEL). Maximum 256 characters.
          type:
          - string
          - 'null'
          maxLength: 256
        enableOrdering:
          description: Whether to enable ordered delivery of messages (requires messages to be published with ordering keys).
          type:
          - boolean
          - 'null'
        ackDeadline:
          description: Acknowledgement deadline for messages, in seconds. Must be between 10 and 600.
          type:
          - integer
          - 'null'
          minimum: 10
          maximum: 600
      required:
      - format
      - projectId
      - topic
      - authentication
      - seekType
    ClickPipeFieldMapping:
      properties:
        sourceField:
          description: Source field name.
          type: string
        destinationField:
          description: Destination field name.
          type: string
    ClickPipeDestination:
      properties:
        database:
          description: Destination database.
          type: string
        table:
          description: Destination table. Required field for all pipe types except database pipes (Postgres, MySQL, BigQuery).
          type: string
        managedTable:
          description: Is the table managed by ClickPipes? Required field for all pipe types except database pipes (Postgres, MySQL, BigQuery).
          type: boolean
        tableDefinition:
          $ref: '#/components/schemas/ClickPipeDestinationTableDefinition'
        columns:
          type: array
          description: Columns of the destination table. Required field for all pipe types except database pipes (Postgres, MySQL, BigQuery).
          items:
            $ref: '#/components/schemas/ClickPipeDestinationColumn'
    ClickPipeSchemaDiscoverySource:
      properties:
        kafka:
          oneOf:
          - $ref: '#/components/schemas/ClickPipePostKafkaSource'
          - type: 'null'
        kinesis:
          oneOf:
          - $ref: '#/components/schemas/ClickPipePostKinesisSource'
          - type: 'null'
        pubsub:
          oneOf:
          - $ref: '#/components/schemas/ClickPipePostPubSubSource'
          - type: 'null'
        objectStorage:
          oneOf:
          - $ref: '#/components/schemas/ClickPipePostObjectStorageSource'
          - type: 'null'
    ClickPipeScaling:
      properties:
        replicas:
          description: Desired number of replicas. Only for scalable pipes.
          type: integer
          minimum: 1
          maximum: 40
        concurrency:
          description: Desired number of concurrency. Only for S3 pipes. If set to 0, concurrency is auto-scaled based on the cluster memory.
          type: integer
          deprecated: true
        replicaCpuMillicores:
          description: CPU in millicores for each replica. Only for streaming pipes.
          type: integer
          minimum: 125
          maximum: 2000
        replicaMemoryGb:
          description: Memory in GB for each replica. Only for streaming pipes.
          type: number
          minimum: 0.5
          maximum: 8
    ClickPipePatchPostgresSource:
      properties:
        credentials:
          $ref: '#/components/schemas/PLAIN'
        host:
          description: PostgreSQL server hostname or IP address. To use a reverse private endpoint, pass the endpoint hostname here.
          type:
          - string
          - 'null'
          format: hostname
          example: my-postgres-server.example.com
        port:
          description: PostgreSQL server port.
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 65535
          example: 5432
        database:
          description: PostgreSQL database name to replicate from.
          type:
          - string
          - 'null'
          example: production_db
        tlsHost:
          description: TLS/SSL host for secure connections.
          type:
          - string
          - 'null'
          example: my-postgres-server.example.com
        caCertificate:
          description: PEM encoded CA certificate to validate the Postgres server certificate.
          type:
          - string
          - 'null'
          example: '-----BEGIN CERTIFICATE-----

            ...'
        disableTls:
          description: Disable TLS for the Postgres connection. Use with caution in production environments.
          type:
          - boolean
          - 'null'
          example: false
        skipCertVerification:
          description: Skip TLS certificate verification for the Postgres connection. Use with caution in production environments.
          type:
          - boolean
          - 'null'
          example: false
        settings:
          $ref: '#/components/schemas/ClickPipePatchPostgresPipeSettings'
        tableMappingsToAdd:
          type: array
          description: Table mappings to add to the pipe. Can be an empty array if no tables are being added.
          items:
            $ref: '#/components/schemas/ClickPipePostgresPipeTableMapping'
          minItems: 0
        tableMappingsToRemove:
          type: array
          description: Table mappings to remove from the pipe. Only sourceSchemaName, sourceTable, and targetTable are required for removal.
          items:
            $ref: '#/components/schemas/ClickPipePatchPostgresPipeRemoveTableMapping'
          minItems: 0
    ClickPipeSchemaDiscoveryMeta:
      type: object
      description: Source-specific schema discovery metadata.
      additionalProperties:
        type: string
    ClickPipeMySQLSource:
      properties:
        type:
          description: Type of the MySQL source. Defaults to "mysql" if not specified.
          type:
          - string
          - 'null'
          enum:
          - mysql
          - rdsmysql
          - auroramysql
          - mariadb
          - rdsmariadb
        host:
          description: MySQL server hostname or IP address. To use a reverse private endpoint, pass the endpoint hostname here.
          type: string
          format: hostname
          example: my-mysql-server.example.com
        port:
          description: MySQL server port.
          type: integer
          minimum: 1
          maximum: 65535
          example: 3306
        authentication:
          description: Authentication method for MySQL connection.
          type: string
          enum:
          - basic
          - IAM_ROLE
          example: basic
        iamRole:
          description: IAM role ARN for IAM authentication (required for IAM_ROLE authentication).
          type: string
          example: arn:aws:iam::123456789012:role/MyApplicationRole
        tlsHost:
          description: TLS/SSL host for secure connections.
          type: string
          example: my-mysql-server.example.com
        caCertificate:
          description: PEM encoded CA certificate to validate the MySQL server certificate.
          type: string
          example: '-----BEGIN CERTIFICATE-----

            ...'
        disableTls:
          description: Disable TLS for the MySQL connection. Use with caution in production environments.
          type: boolean
          example: false
        skipCertVerification:
          description: Skip TLS certificate verification for the MySQL connection. Use with caution in production environments.
          type: boolean
          example: false
        serverId:
          description: Optional MySQL server_id the pipe declares itself as in the MySQL replication topology. Must be unique across replicas connected to the source. If omitted, one is assigned automatically.
          type: integer
          minimum: 1
          maximum: 4294967295
          example: 4242
        settings:
          $ref: '#/components/schemas/ClickPipeMySQLPipeSettings'
        tableMappings:
          type: array
          description: List of table mappings defining which MySQL tables to replicate and how they map to ClickHouse tables.
          items:
            $ref: '#/components/schemas/ClickPipeMySQLPipeTableMapping'
      required:
      - host
      - port
      - settings
      - tableMappings
    ClickPipesCdcScaling:
      properties:
        replicaCpuMillicores:
          description: CPU in millicores for DB ClickPipes.
          type: integer
          minimum: 1000
          maximum: 32000
          multipleOf: 1000
          example: 2000
        replicaMemoryGb:
          description: Memory in GiB for DB ClickPipes. Must be 4× the CPU core count.
          type: number
          minimum: 4
          maximum: 128
          multipleOf: 4
          example: 8
    ClickPipePatchPubSubSource:
      properties:
        authentication:
          description: Authentication method to use with GCP Pub/Sub. SERVICE_ACCOUNT_WORKLOAD_IDENTITY is in Private Preview. ClickPipes uses the GCP service account returned in gcpWorkloadIdentity.principal by the operation with operationId clickPipesServiceContextGet; grant it access to the source resources.
          type:
          - string
          - 'null'
          enum:
          - SERVICE_ACCOUNT
          - SERVICE_ACCOUNT_WORKLOAD_IDENTITY
          example: SERVICE_ACCOUNT
        ackDeadline:
          description: Acknowledgement deadline for messages, in seconds. Must be between 10 and 600.
          type:
          - integer
          - 'null'
          minimum: 10
          maximum: 600
        serviceAccountKey:
          oneOf:
          - $ref: '#/components/schemas/ServiceAccount'
          - type: 'null'
      required:
      - authentication
    ClickPipeMutateKafkaSchemaRegistry:
      properties:
        url:
          description: Schema URL. HTTPS required.
          type: string
          example: https://psrc-aa00.us-east-2.aws.confluent.cloud/schemas/ids/100004
        authentication:
          description: Authentication type of the schema registry.
          type: string
          enum:
          - PLAIN
        caCertificate:
          description: PEM encoded CA certificates to validate the schema registry's certificate.
          type:
          - string
          - 'null'
        credentials:
          $ref: '#/components/schemas/ClickPipeKafkaSchemaRegistryCredentials'
    ClickPipePostPubSubServiceAccountSource:
      properties:
        format:
          description: Format of messages in the Pub/Sub topic. GCP Pub/Sub ClickPipes are in limited preview — contact support to enable this feature for your organization.
          type: string
          enum:
          - JSONEachRow
          - Avro
          - Protobuf
          example: JSONEachRow
        projectId:
          description: GCP project ID that owns the Pub/Sub topic.
          type: string
          example: my-gcp-project
        topic:
          description: Pub/Sub topic name (not the fully-qualified path).
          type: string
          example: my-topic
        authentication:
          description: Authenticate with a GCP service account JSON key.
          type: string
          enum:
          - SERVICE_ACCOUNT
          example: SERVICE_ACCOUNT
        seekType:
          description: Starting position strategy for consuming the subscription. The seekTimestamp companion is required only when seekType is "timestamp"; setting it for a mismatched seek type is rejected.
          type: string
          enum:
          - latest
          - earliest
          - timestamp
          example: earliest
        seekTimestamp:
          description: RFC 3339 / ISO 8601 timestamp to seek to. Required when seekType is "timestamp"; must be omitted otherwise.
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-04-10T12:00:00Z'
        filter:
          description: Optional Pub/Sub subscription filter expression (CEL). Maximum 256 characters.
          type:
          - string
          - 'null'
          maxLength: 256
        enableOrdering:
          description: Whether to enable ordered delivery of messages (requires messages to be published with ordering keys).
          type:
          - boolean
          - 'null'
        ackDeadline:
          description: Acknowledgement deadline for messages, in seconds. Must be between 10 and 600.
          type:
          - integer
          - 'null'
          minimum: 10
          maximum: 600
        serviceAccountKey:
          $ref: '#/components/schemas/ServiceAccount'
      required:
      - format
      - projectId
      - topic
      - authentication
      - seekType
      - serviceAccountKey
      additionalProperties: false
    ClickPipeMutateMongoDBSource:
      properties:
        credentials:
          $ref: '#/components/schemas/PLAIN'
        uri:
          description: MongoDB connection URI. Supports both standard URIs (mongodb://...) and SRV URIs (mongodb+srv://...). Embedded credentials are redacted from API responses, so the returned value can differ from what was submitted.
          type: string
          example: mongodb+srv://cluster0.example.mongodb.net/mydb
        readPreference:
          description: MongoDB read preference for replica set reads.
          type: string
          enum:
          - primary
          - primaryPreferred
          - secondary
          - secondaryPreferred
          - nearest
          example: secondaryPreferred
        tlsHost:
          description: TLS/SSL host for secure connections.
          type: string
          example: cluster0.example.mongodb.net
        disableTls:
          description: Disable TLS for the MongoDB connection. Defaults to false (TLS enabled).
          type: boolean
          example: false
          default: false
        skipCertVerification:
          description: Skip TLS certificate verification for the MongoDB connection. Use with caution in production environments.
          type: boolean
          example: false
        caCertificate:
          description: PEM encoded CA certificate to validate the MongoDB server certificate.
          type: string
          example: '-----BEGIN CERTIFICATE-----

            ...'
        settings:
          $ref: '#/components/schemas/ClickPipeMongoDBPipeSettings'
        tableMappings:
          type: array
          description: List of collection mappings defining which MongoDB collections to replicate and how they map to ClickHouse tables.
          items:
            $ref: '#/components/schemas/ClickPipeMongoDBPipeTableMapping'
      required:
      - uri
      - readPreference
      - settings
      - tableMappings
    ClickPipePatchMySQLPipeSettings:
      properties:

        pullBatchSize:
          description: Number of rows to pull in each batch during CDC replication.
          type:
          - integer
          - 'null'
          minimum: 1
          example: 1000
        useCompression:
          description: Enable compression for the MySQL connection.
          type:
          - boolean
          - 'null'
          example: false
    ClickPipeSchemaDiscoveryField:
      properties:

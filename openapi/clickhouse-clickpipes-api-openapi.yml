          type: string
          enum:
          - PLAIN
          - SCRAM-SHA-256
          - SCRAM-SHA-512
          - IAM_ROLE
          - IAM_USER
          - MUTUAL_TLS
          - SERVICE_ACCOUNT_WORKLOAD_IDENTITY

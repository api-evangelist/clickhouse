components:
  schemas:
    PublicQueryApiEndpointListItem:
      type: object
      properties:
        id:
          description: Unique ID of the Query API endpoint.
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        name:
          description: Name of the Query API endpoint.
          type: string
        database:
          description: Database used by the Query API endpoint.
          type: string
        apiKeyIds:
          description: API key IDs allowed to call the endpoint.
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        roles:
          description: Database roles used by the endpoint.
          type: array
          items:
            type: string
        allowedOrigins:
          description: Origins allowed by the endpoint CORS policy.
          type: array
          items:
            type: string
        url:
          description: Public URL used to execute the endpoint.
          example: https://queries.clickhouse.cloud/run/00000000-0000-0000-0000-000000000000
          type: string
          format: uri
        ownerType:
          description: Owner type of the Query API endpoint. Endpoints with a user owned query cannot be updated or deleted through this API.
          type: string
          enum:
          - user
          - queryApiEndpoint
      required:
      - id
      - name
      - database
      - apiKeyIds
      - roles
      - allowedOrigins
      - url
      - ownerType
      additionalProperties: false
    PublicQueryApiEndpoint:
      type: object
      properties:
        id:
          description: Unique ID of the Query API endpoint.
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        name:
          description: Name of the Query API endpoint.
          type: string
        sql:
          description: SQL executed by the endpoint.
          type: string
          maxLength: 4194304
        database:
          description: Database used by the Query API endpoint.
          type: string
        parameters:
          description: Query parameters.
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        apiKeyIds:
          description: API key IDs allowed to call the endpoint.
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        roles:
          description: Database roles used by the endpoint.
          type: array
          items:
            type: string
        allowedOrigins:
          description: Origins allowed by the endpoint CORS policy.
          type: array
          items:
            type: string
        url:
          description: Public URL used to execute the endpoint.
          example: https://queries.clickhouse.cloud/run/00000000-0000-0000-0000-000000000000
          type: string
          format: uri
        ownerType:
          description: Owner type of the Query API endpoint. Endpoints with a user owned query cannot be updated or deleted through this API.
          type: string
          enum:
          - user
          - queryApiEndpoint
      required:
      - id
      - name
      - sql
      - database
      - parameters
      - apiKeyIds
      - roles
      - allowedOrigins
      - url
      - ownerType
      additionalProperties: false
    PublicQueryApiEndpointRequest:
      type: object
      properties:
        name:
          description: Name of the Query API endpoint.
          type: string
          minLength: 1
          pattern: \S
        sql:
          description: SQL executed by the endpoint.
          type: string
          maxLength: 4194304
          pattern: \S
        database:
          description: Database used by the Query API endpoint.
          type: string
          pattern: \S
        parameters:
          description: Default query parameters.
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        apiKeyIds:
          description: API key IDs allowed to call the endpoint.
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
        roles:
          description: Database roles used by the endpoint.
          minItems: 1
          type: array
          items:
            type: string
            minLength: 1
        allowedOrigins:
          description: Origins allowed by the endpoint CORS policy.
          default: []
          type: array
          items:
            type: string
      required:
      - name
      - sql
      - database
      - apiKeyIds
      - roles
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'
      x-permission-scopes: The scope list of a `security` requirement holds ClickHouse Cloud API key permission ids (for example `control-plane:organization:view`), not OAuth scopes. OpenAPI has no field for API key permissions, so this is the closest available place. A key must hold every permission listed on an operation to call it; an operation with no scopes needs none beyond a valid key. Every operation declares at most one requirement object, always for this scheme, so the list is only ever conjunctive — alternative sets of permissions are never expressed.

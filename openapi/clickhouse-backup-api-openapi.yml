components:
  schemas:
    AwsBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS Role session name
          type: string
        iamRoleExternalId:
          description: External ID the IAM role trust policy requires when the data plane assumes the role
          type: string
    AzureBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
        connectionString:
          description: Connection String
          type: string
    GcpBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
        secretAccessKey:
          description: Secret Access Key (HMAC secret key)
          type: string
    AzureBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
    AzureBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID.
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
    GcpBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
    BackupBucketPatchRequest:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucketPatchRequestV1'
      - $ref: '#/components/schemas/GcpBackupBucketPatchRequestV1'
      - $ref: '#/components/schemas/AzureBackupBucketPatchRequestV1'
    GcpBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
        secretAccessKey:
          description: Secret Access Key (HMAC secret key)
          type: string
    BackupConfiguration:
      properties:
        backupPeriodInHours:
          description: The interval in hours between each backup.
          type: number
        backupRetentionPeriodInHours:
          description: The minimum duration in hours for which the backups are available. Must be a whole number of days between 24 (1 day) and 1080 (45 days) — i.e. a multiple of 24.
          type: number
        backupStartTime:
          description: The time in HH:MM format for the backups to be performed (evaluated in UTC timezone). When defined the backup period resets to every 24 hours.
          type: string
    AzureBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
        connectionString:
          description: Connection String
          type: string
    AwsBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS  Role session name
          type: string
        iamRoleExternalId:
          description: External ID the IAM role trust policy requires when the data plane assumes the role
          type: string
    Backup:
      properties:
        id:
          description: Unique backup ID.
          type: string
          format: uuid
        status:
          description: 'Status of the backup: ''done'', ''error'', ''in_progress''.'
          type: string
          enum:
          - done
          - error
          - in_progress
        serviceId:
          description: 'Name '
          type: string
        startedAt:
          description: Backup start timestamp. ISO-8601.
          type: string
          format: date-time
        finishedAt:
          description: Backup finish timestamp. ISO-8601. Available only for finished backups
          type: string
          format: date-time
        sizeInBytes:
          description: Size of the backup in bytes.
          type: number
        durationInSeconds:
          description: Time in seconds it took to perform the backup. If the status still in_progress, this is the time in seconds since the backup started until now.
          type: number
        type:
          description: Backup type ("full" or "incremental").
          type: string
          enum:
          - full
          - incremental
        backupName:
          description: Backup name on the external backup bucket.
          type: string
        bucket:
          description: Backup bucket where the backup is stored.
          oneOf:
          - $ref: '#/components/schemas/AwsBackupBucketProperties'
          - $ref: '#/components/schemas/GcpBackupBucketProperties'
          - $ref: '#/components/schemas/AzureBackupBucketProperties'
    GcpBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
    BackupBucket:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucket'
      - $ref: '#/components/schemas/GcpBackupBucket'
      - $ref: '#/components/schemas/AzureBackupBucket'
    AwsBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS IAM Role session name
          type:
          - string
          - 'null'
        iamRoleExternalId:
          description: External ID the IAM role trust policy requires when the data plane assumes the role. Set to `null` to clear it.
          type:
          - string
          - 'null'
    AwsBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS IAM Role
          type: string
        iamRoleSessionName:
          description: AWS IAM Role
          type: string
        iamRoleExternalId:
          description: External ID the IAM role trust policy requires when the data plane assumes the role
          type: string
    BackupConfigurationPatchRequest:
      properties:
        backupPeriodInHours:
          description: The interval in hours between each backup.
          type:
          - number
          - 'null'
        backupRetentionPeriodInHours:
          description: The minimum duration in hours for which the backups are available. Must be a whole number of days between 24 (1 day) and 1080 (45 days) — i.e. a multiple of 24.
          type:
          - number
          - 'null'
        backupStartTime:
          description: The time in HH:MM format for the backups to be performed (evaluated in UTC timezone). When defined the backup period resets to every 24 hours.
          type:
          - string
          - 'null'
    BackupBucketPostRequest:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucketPostRequestV1'
      - $ref: '#/components/schemas/GcpBackupBucketPostRequestV1'
      - $ref: '#/components/schemas/AzureBackupBucketPostRequestV1'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'
      x-permission-scopes: The scope list of a `security` requirement holds ClickHouse Cloud API key permission ids (for example `control-plane:organization:view`), not OAuth scopes. OpenAPI has no field for API key permissions, so this is the closest available place. A key must hold every permission listed on an operation to call it; an operation with no scopes needs none beyond a valid key. Every operation declares at most one requirement object, always for this scheme, so the list is only ever conjunctive — alternative sets of permissions are never expressed.

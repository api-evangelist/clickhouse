components:
  schemas:
    AzureBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
        connectionString:
          description: Connection String
          type: string
    AwsBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS  Role session name
          type: string
    AwsBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS IAM Role
          type: string
        iamRoleSessionName:
          description: AWS IAM Role
          type: string
    GcpBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
    AzureBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID.
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
    BackupConfigurationPatchRequest:
      properties:
        backupPeriodInHours:
          description: The interval in hours between each backup.
          type: number
        backupRetentionPeriodInHours:
          description: The minimum duration in hours for which the backups are available. Must be a whole number of days between 24 (1 day) and 1080 (45 days) — i.e. a multiple of 24.
          type: number
        backupStartTime:
          description: The time in HH:MM format for the backups to be performed (evaluated in UTC timezone). When defined the backup period resets to every 24 hours.
          type: string
    AzureBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
        connectionString:
          description: Connection String
          type: string
    BackupBucket:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucket'
      - $ref: '#/components/schemas/GcpBackupBucket'
      - $ref: '#/components/schemas/AzureBackupBucket'
    AwsBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS IAM Role session name
          type:
          - string
          - 'null'
    BackupBucketPatchRequest:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucketPatchRequestV1'
      - $ref: '#/components/schemas/GcpBackupBucketPatchRequestV1'
      - $ref: '#/components/schemas/AzureBackupBucketPatchRequestV1'
    AwsBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AWS
        bucketPath:
          description: Bucket path
          type: string
        iamRoleArn:
          description: AWS Role ARN
          type: string
        iamRoleSessionName:
          description: AWS Role session name
          type: string
    AzureBackupBucketProperties:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - AZURE
        containerName:
          description: Container Name
          type: string
    Backup:
      properties:
        id:
          description: Unique backup ID.
          type: string
          format: uuid
        status:
          description: 'Status of the backup: ''done'', ''error'', ''in_progress''.'
          type: string
          enum:
          - done
          - error
          - in_progress
        serviceId:
          description: 'Name '
          type: string
        startedAt:
          description: Backup start timestamp. ISO-8601.
          type: string
          format: date-time
        finishedAt:
          description: Backup finish timestamp. ISO-8601. Available only for finished backups
          type: string
          format: date-time
        sizeInBytes:
          description: Size of the backup in bytes.
          type: number
        durationInSeconds:
          description: Time in seconds it took to perform the backup. If the status still in_progress, this is the time in seconds since the backup started until now.
          type: number
        type:
          description: Backup type ("full" or "incremental").
          type: string
          enum:
          - full
          - incremental
        backupName:
          description: Backup name on the external backup bucket.
          type: string
        bucket:
          description: Backup bucket where the backup is stored.
          oneOf:
          - $ref: '#/components/schemas/AwsBackupBucketProperties'
          - $ref: '#/components/schemas/GcpBackupBucketProperties'
          - $ref: '#/components/schemas/AzureBackupBucketProperties'
    BackupConfiguration:
      properties:
        backupPeriodInHours:
          description: The interval in hours between each backup.
          type: number
        backupRetentionPeriodInHours:
          description: The minimum duration in hours for which the backups are available. Must be a whole number of days between 24 (1 day) and 1080 (45 days) — i.e. a multiple of 24.
          type: number
        backupStartTime:
          description: The time in HH:MM format for the backups to be performed (evaluated in UTC timezone). When defined the backup period resets to every 24 hours.
          type: string
    BackupBucketPostRequest:
      oneOf:
      - $ref: '#/components/schemas/AwsBackupBucketPostRequestV1'
      - $ref: '#/components/schemas/GcpBackupBucketPostRequestV1'
      - $ref: '#/components/schemas/AzureBackupBucketPostRequestV1'
    GcpBackupBucketPatchRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
        secretAccessKey:
          description: Secret Access Key (HMAC secret key)
          type: string
    GcpBackupBucketPostRequestV1:
      properties:
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
        secretAccessKey:
          description: Secret Access Key (HMAC secret key)
          type: string
    GcpBackupBucket:
      properties:
        id:
          description: Unique backup bucket ID
          type: string
          format: uuid
        bucketProvider:
          description: Bucket provider
          type: string
          enum:
          - GCP
        bucketPath:
          description: Bucket path
          type: string
        accessKeyId:
          description: Access Key ID (HMAC key)
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'

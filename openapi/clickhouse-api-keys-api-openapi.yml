components:
  schemas:
    IpAccessListEntry:
      properties:
        source:
          description: IP or CIDR
          type: string
        description:
          description: Optional description of IPv4 address or IPv4 CIDR to allow access from
          type: string
    ApiKey:
      properties:
        id:
          description: Unique API key ID.
          type: string
          format: uuid
        name:
          description: Name of the key
          type: string
        state:
          description: 'State of the key: ''enabled'', ''disabled''.'
          type: string
          enum:
          - enabled
          - disabled
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoles` instead. List of roles assigned to the key. For organizations that have migrated to custom roles, this field is frozen at the pre-migration value and does not reflect current role assignments.
          items:
            type: string
            enum:
            - admin
            - developer
            - query_endpoints
          deprecated: true
        assignedRoles:
          type: array
          description: Custom roles and System roles assigned to this API key
          items:
            $ref: '#/components/schemas/AssignedRole'
        keySuffix:
          description: Last 4 letters of the key.
          type: string
        createdAt:
          description: Timestamp the key was created. ISO-8601.
          type: string
          format: date-time
        expireAt:
          description: Timestamp the key expires. If not present, `null` or is empty the key never expires. ISO-8601.
          type:
          - string
          - 'null'
          format: date-time
        usedAt:
          description: Timestamp the key was used last time, with one-minute precision. If not present the key was never used. ISO-8601.
          type: string
          format: date-time
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
    ApiKeyHashData:
      properties:
        keyIdHash:
          description: 'Hash of the key ID. '
          type: string
        keyIdSuffix:
          description: 'Last 4 digits of the key ID. Algorithm: echo -n "yourpassword" | sha256sum | tr -d ''-'' | xxd -r -p | base64'
          type: string
        keySecretHash:
          description: 'Hash of the key secret. Algorithm: echo -n "yourpassword" | sha256sum | tr -d ''-'' | xxd -r -p | base64'
          type: string
    AssignedRole:
      properties:
        roleId:
          description: Unique identifier of the role
          type: string
          format: uuid
        roleName:
          description: Human-readable name of the role
          type: string
        roleType:
          description: 'Type of role: system (predefined) or custom (organization-defined)'
          type: string
          enum:
          - system
          - custom
    ApiKeyPostResponse:
      properties:
        key:
          $ref: '#/components/schemas/ApiKey'
        keyId:
          description: Generated key ID. Provided only if there was no 'hashData' in the request.
          type: string
        keySecret:
          description: Generated key secret. Provided only if there was no 'hashData' in the request.
          type: string
    ApiKeyPatchRequest:
      properties:
        name:
          description: Name of the key
          type: string
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoleIds` instead. List of roles assigned to the key.
          items:
            type: string
            enum:
            - admin
            - developer
            - query_endpoints
          deprecated: true
        assignedRoleIds:
          type: array
          description: Array of role UUIDs to assign to the API key
          items:
            type: string
            format: uuid
        expireAt:
          description: Timestamp the key expires. If `null` or is empty the key never expires. ISO-8601.
          type:
          - string
          - 'null'
          format: date-time
        state:
          description: 'State of the key: ''enabled'', ''disabled''.'
          type: string
          enum:
          - enabled
          - disabled
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
    ApiKeyPostRequest:
      properties:
        name:
          description: Name of the key.
          type: string
        expireAt:
          description: Timestamp the key expires. If not present, `null` or is empty the key never expires. ISO-8601.
          type:
          - string
          - 'null'
          format: date-time
        state:
          description: 'Initial state of the key: ''enabled'', ''disabled''. If not provided the new key will be ''enabled''.'
          type: string
          enum:
          - enabled
          - disabled
        hashData:
          $ref: '#/components/schemas/ApiKeyHashData'
        roles:
          type: array
          description: DEPRECATED. Use `assignedRoleIds` instead. List of roles assigned to the key. Contains at least 1 element.
          items:
            type: string
            enum:
            - admin
            - developer
            - query_endpoints
          deprecated: true
        assignedRoleIds:
          type: array
          description: Array of role UUIDs to assign to the API key
          items:
            type: string
            format: uuid
        ipAccessList:
          type: array
          description: List of IP addresses allowed to access the API using this key
          items:
            $ref: '#/components/schemas/IpAccessListEntry'
      required:
      - name
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'
      x-permission-scopes: The scope list of a `security` requirement holds ClickHouse Cloud API key permission ids (for example `control-plane:organization:view`), not OAuth scopes. OpenAPI has no field for API key permissions, so this is the closest available place. A key must hold every permission listed on an operation to call it; an operation with no scopes needs none beyond a valid key. Every operation declares at most one requirement object, always for this scheme, so the list is only ever conjunctive — alternative sets of permissions are never expressed.

components:
  schemas:
    Whoami:
      oneOf:
      - $ref: '#/components/schemas/WhoamiUser'
      - $ref: '#/components/schemas/WhoamiApiKey'
    InvitationPostRequest:
      properties:
        email:
          description: Email of the invited user. Only a user with this email can join using the invitation. The email is stored in a lowercase form.
          type: string
          format: email
        role:
          description: DEPRECATED. Use `assignedRoleIds` instead. Role to assign to the invited user in the organization.
          type: string
          enum:
          - admin
          - developer
          deprecated: true
        assignedRoleIds:
          type: array
          description: List of role IDs to assign to the invited user when they accept the invitation
          items:
            type: string
      required:
      - email
    WhoamiOrganization:
      properties:
        organizationId:
          description: ID of the organization the user belongs to.
          type: string
          format: uuid
        organizationName:
          description: Name of the organization.
          type: string
      required:
      - organizationId
      - organizationName
    MemberPatchRequest:
      properties:
        role:
          description: DEPRECATED. Use `assignedRoleIds` instead. Role of the member in the organization.
          type: string
          enum:
          - admin
          - developer
          deprecated: true
        assignedRoleIds:
          type: array
          description: List of role IDs to assign to the member
          items:
            type: string
    Member:
      properties:
        userId:
          description: Unique user ID. If a user is a member in multiple organizations this ID will stay the same.
          type: string
        name:
          description: Name of the member as set a personal user profile.
          type: string
        email:
          description: Email of the member as set in personal user profile.
          type: string
          format: email
        role:
          description: DEPRECATED. Use `assignedRoles` instead. Role of the member in the organization. For organizations that have migrated to custom roles, this field is frozen at the pre-migration value and does not reflect current role assignments.
          type: string
          enum:
          - admin
          - developer
          deprecated: true
        joinedAt:
          description: Timestamp the member joined the organization. ISO-8601.
          type: string
          format: date-time
        assignedRoles:
          type: array
          description: Custom roles and System roles assigned to this member
          items:
            $ref: '#/components/schemas/AssignedRole'
    WhoamiUser:
      properties:
        actorType:
          description: Discriminator identifying the caller as a user (JWT or clickhousectl token).
          type: string
          const: user
        userId:
          description: Unique ID of the user.
          type: string
          format: uuid
        email:
          description: Email address of the user.
          type: string
          format: email
        name:
          description: Full name of the user.
          type: string
        organizations:
          type: array
          description: Organizations the user belongs to.
          items:
            $ref: '#/components/schemas/WhoamiOrganization'
      required:
      - actorType
      - userId
      - email
      - name
      - organizations
    Invitation:
      properties:
        role:
          description: DEPRECATED. Use `assignedRoles` instead. Role of the invited user in the organization. For organizations that have migrated to custom roles, this field is frozen at the pre-migration value and does not reflect the role assignment that will be applied.
          type: string
          enum:
          - admin
          - developer
          deprecated: true
        id:
          description: Unique invitation ID.
          type: string
          format: uuid
        email:
          description: Email of the invited user. Only a user with this email can join using the invitation. The email is stored in a lowercase form.
          type: string
          format: email
        createdAt:
          description: Invitation creation timestamp. ISO-8601.
          type: string
          format: date-time
        expireAt:
          description: Timestamp the invitation expires. ISO-8601.
          type: string
          format: date-time
        assignedRoles:
          type: array
          description: Custom roles and System roles that will be assigned to the user when they accept the invitation
          items:
            $ref: '#/components/schemas/AssignedRole'
    AssignedRole:
      properties:
        roleId:
          description: Unique identifier of the role
          type: string
          format: uuid
        roleName:
          description: Human-readable name of the role
          type: string
        roleType:
          description: 'Type of role: system (predefined) or custom (organization-defined)'
          type: string
          enum:
          - system
          - custom
    WhoamiApiKey:
      properties:
        actorType:
          description: Discriminator identifying the caller as an organization API key.
          type: string
          const: apiKey
        keyId:
          description: Unique ID of the API key.
          type: string
        name:
          description: Name of the API key.
          type: string
        organizationId:
          description: ID of the organization that owns the API key.
          type: string
          format: uuid
      required:
      - actorType
      - keyId
      - name
      - organizationId
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'Use key ID and key secret obtained in ClickHouse Cloud console: https://clickhouse.com/docs/cloud/manage/openapi'
      x-permission-scopes: The scope list of a `security` requirement holds ClickHouse Cloud API key permission ids (for example `control-plane:organization:view`), not OAuth scopes. OpenAPI has no field for API key permissions, so this is the closest available place. A key must hold every permission listed on an operation to call it; an operation with no scopes needs none beyond a valid key. Every operation declares at most one requirement object, always for this scheme, so the list is only ever conjunctive — alternative sets of permissions are never expressed.

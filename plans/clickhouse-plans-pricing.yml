specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: ClickHouse
providerId: clickhouse
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://clickhouse.com/pricing.md
source_note: >-
  ClickHouse publishes a machine-readable markdown twin of its pricing page at https://clickhouse.com/pricing.md
  (HTTP 200, text/markdown, 25,751 bytes on 2026-09-05) carrying plans, per-region compute and storage rates,
  the calculation formulas, and an explicit "Agent instructions" section. Every figure below is quoted from
  that document. This artifact REPLACES the 2026-05-04 scaffold, whose limits and prices were placeholders.
description: >-
  ClickHouse Cloud plans and usage-based pricing. Compute and storage are metered and billed separately, with
  no monthly minimum; a plan selects the feature set and the per-unit rate band, not a fixed subscription price.
billing_model:
  type: usage-based
  minimum: none
  currency: USD
  credit_unit: 1 ClickHouse Credit (CHC) = $1 USD of usage
  metered:
    - compute
    - storage
    - backups
    - data transfer (egress)
    - ClickPipes
  compute_metering: per minute, priced per compute-unit-hour; 1 compute unit = 8 GiB RAM, 2 vCPU
  storage_metering: per TB-month on compressed data size
  invoice: consolidated monthly per organization, billed in $0.01 increments
  billing_period: monthly, from the organization creation date
  purchase_channels:
    - Self-service (monthly pay-as-you-go, credit card, USD)
    - Direct / committed spend (prepaid credits, annual or multi-year)
    - AWS Marketplace
    - GCP Marketplace
    - Azure Marketplace
  credit_consumption_order:
    - committed credits
    - marketplace pay-as-you-go
    - credit-card pay-as-you-go
trial:
  credits: $300
  duration_days: 30
  ends: after 30 days or once the credits are consumed, whichever comes first
  then: converts to pay-as-you-go
  signup: https://console.clickhouse.cloud/signUp
plan_count: 4
plans:
  - id: clickhouse-oss
    name: ClickHouse (open source)
    type: open-source
    price: 0
    currency: USD
    description: Self-hosted ClickHouse, free forever. Install with `curl https://clickhouse.com/ | sh`.
  - id: clickhouse-basic
    name: Basic
    type: usage-based
    currency: USD
    billing_period: month
    description: Great for testing out new ideas or starter projects. Limited storage and memory.
    limits:
      storage: Up to 1 TB
      memory: 8-12 GiB total memory
      availability_zones: 1
      backups: every 24h, retained for 1 day
    included:
      - Export backups to your own cloud account
      - Expert support with 1 business day response time
      - SSO using Google or Microsoft social login
      - Multi-factor authentication (MFA)
    example_price:
      note: Published example on the pricing page — 1 replica x 8 GiB RAM, 2 vCPU, 500 GB compressed
      from: $66.52/month
  - id: clickhouse-scale
    name: Scale
    type: usage-based
    currency: USD
    billing_period: month
    description: For production environments, data at scale, or professional use cases. Marked "most popular".
    limits:
      storage: Unlimited
      memory: Configurable
      availability_zones: 2+
      backups: every 24h retained for 1 day, configurable
    included:
      - Expert support with 1 hour response time 24x7 for Severity 1 issues
      - Compute-compute separation
      - Configurable backups
      - S3 role-based access
      - Private networking
      - Automatic vertical scaling
      - Manual horizontal scaling
      - SSO using Google or Microsoft social login
      - Multi-factor authentication (MFA)
    example_price:
      note: Published example — 2 replicas x 8 GiB RAM, 2 vCPU
      from: $499.38/month
  - id: clickhouse-enterprise
    name: Enterprise
    type: usage-based
    currency: USD
    billing_period: month
    description: For very large data at scale or enterprise use cases; compliance-gated features live here.
    limits:
      storage: Unlimited
      memory: Configurable
      availability_zones: 2+
    included:
      - Enterprise support with 30 minute response time for Severity 1 issues
      - Named Lead Support Engineer
      - SAML Single sign-on
      - Private regions
      - Manual vertical scaling for custom profiles
      - Transparent data encryption / CMEK
      - Scheduled upgrades
      - Consultative migration guides
      - HIPAA and PCI compliance
      - Everything in Scale
    example_price:
      note: Published example — 2 replicas x 32 GiB RAM, 8 vCPU
      from: $2,285.60/month
rates:
  unit_definitions:
    compute_unit: 8 GiB RAM, 2 vCPU — priced per compute-unit-hour
    storage_unit: 1 TB of compressed data per month
  compute_and_storage:
    - cloud: AWS
      region: us-east-1
      plan: enterprise
      compute_per_unit_hour: 0.39030
      storage_per_tb_month: 25.30
    - cloud: AWS
      region: eu-central-1
      plan: enterprise
      compute_per_unit_hour: 0.46974
      storage_per_tb_month: 26.95
    - cloud: AWS
      region: ap-northeast-1
      plan: enterprise
      compute_per_unit_hour: 0.50428
      storage_per_tb_month: 27.50
    - cloud: GCP
      region: us-central1
      plan: enterprise
      compute_per_unit_hour: 0.32727
      storage_per_tb_month: 22.00
    - cloud: Azure
      region: eastus2
      plan: enterprise
      compute_per_unit_hour: 0.43138
      storage_per_tb_month: 25.30
    - note: >-
        The published table covers 13 AWS, 3 Azure and 6 GCP regions. A representative sample is recorded here;
        the full per-region table is at https://clickhouse.com/pricing.md and is refreshed on each deployment.
  data_transfer:
    ingress: not charged
    egress_examples:
      - cloud: AWS
        region: us-east-1
        public_internet_per_gb: 0.115
        inter_region_per_gb: 0.031
      - cloud: GCP
        region: us-central1
        public_internet_per_gb: 0.114
        inter_region_per_gb: 0.036
      - cloud: Azure
        region: eastus2
        public_internet_per_gb: 0.102
        inter_region_per_gb: 0.030
  clickpipes:
    streaming: $0.20 / hr per compute unit plus $0.04 / GB ingested per month
    object_storage: compute only, no per-GB ingestion fee
    postgres_cdc: priced separately — https://clickhouse.com/docs/cloud/reference/billing/clickpipes/postgres-cdc
  backups: billed at the same per-TB-month rate as data storage in the same region
byoc:
  self_service: false
  published_rates: false
  note: Bring Your Own Cloud is quoted, not rated — contact sales.
cost_controls:
  - Compute autoscaling limits (a maximum memory ceiling) cap spend
  - Scale-to-zero stops compute automatically while a service is idle
  - Spend alerts fire at 50%, 75%, 90% and 100% of a configured threshold
  - Compute-storage separation bills shared storage once regardless of how many compute services read it
api_pricing_endpoints:
  note: >-
    The Cloud API exposes billing reads — usageCostGet, activeBalancesGet, creditBalancesGet — so an agent can
    read its own spend, but there is no machine-readable price catalog endpoint. pricing.md is the machine-readable
    price source.

- file: clickhouse-chdb-datastore.md
  name: chdb-datastore
  description: 'Use when the user has tabular data (pandas DataFrame, parquet, csv, Arrow, json) and wants to filter,
    group, aggregate, join, or speed up slow pandas. Provides chDB DataStore — same pandas API, ClickHouse engine
    underneath. Also handles reading from S3, MySQL, PostgreSQL, MongoDB, ClickHouse Cloud, Iceberg, Delta Lake
    as DataFrames and joining across sources. TRIGGER when: user mentions DataFrame, parquet, csv, "fast pandas",
    "speed up pandas", or cross-source DataFrame joins; user imports `chdb.datastore` or `from datastore import
    DataStore`. SKIP this skill for raw SQL syntax (use chdb-sql instead), ClickHouse server administration, or
    non-Python DataStore API work.'
  license: Apache-2.0
  version: '4.1'
  author: chdb-io
  upstream: https://github.com/ClickHouse/agent-skills/blob/main/skills/chdb-datastore/SKILL.md
- file: clickhouse-chdb-sql.md
  name: chdb-sql
  description: 'Use when the user wants to run SQL — especially analytical SQL — on local files (parquet/csv/json),
    URLs, S3 paths, or remote databases (Postgres, MySQL, MongoDB, ClickHouse Cloud, Iceberg, Delta Lake) without
    setting up a server. Provides chDB — embedded ClickHouse SQL in Python with 1000+ functions, Session for stateful
    multi-step pipelines, parametrized queries, and cross-source joins via `s3()`, `mysql()`, `postgresql()`, `iceberg()`,
    `deltaLake()`, `remoteSecure()` table functions. TRIGGER when: user wants SQL on parquet/csv/files or across
    remote analytical sources; uses ClickHouse SQL features (window functions, windowFunnel, geoToH3, JSON path
    ops, Session, parametrized queries); imports `chdb` or calls `chdb.query()`. SKIP this skill for pandas-style
    DataFrame method-chaining (use chdb-datastore instead) or ClickHouse server administration.'
  license: Apache-2.0
  version: '4.1'
  author: chdb-io
  upstream: https://github.com/ClickHouse/agent-skills/blob/main/skills/chdb-sql/SKILL.md

specification: Tool Crosswalk
specificationVersion: '0.1'
provider: ClickHouse
providerId: clickhouse
generated: '2026-09-05'
method: derived
source: mcp/clickhouse-mcp.yml (documented remote MCP tool list) bound to openapi/clickhouse-cloud-api-openapi.json (live
  first-party spec fetched from https://api.clickhouse.cloud/v1)
note: The live MCP schemas are OAuth-gated (tools/list returns 401 anonymously), so every binding below was made by name and
  documented semantics against the ClickHouse Cloud OpenAPI, not by comparing inputSchemas. Each bound tool inherits the parameters
  and responses of its backing operation. The three query tools have no control-plane operation at all — they run against
  the database, which is a different surface from api.clickhouse.cloud.
surfaces:
  openapi:
    url: https://api.clickhouse.cloud/v1
    file: openapi/clickhouse-cloud-api-openapi.json
    gated: false
    auth: HTTP Basic (key ID + key secret)
  mcp:
    url: https://mcp.clickhouse.cloud/mcp
    gated: true
    auth: OAuth 2.1 + per-service enablement
  graphql: null
coverage:
  mcp_tools: 13
  mapped_tools: 10
  mcp_only_tools: 3
  rest_operations: 148
  rest_operations_with_a_tool: 10
  rest_only_operations: 138
  tool_coverage_of_rest_pct: 6.8

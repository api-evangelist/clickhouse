mcp_only:
- tool: run_select_query
  reason: Executes SQL against the ClickHouse database over the service query endpoint (HTTP interface / Query API Endpoints),
    not over the api.clickhouse.cloud control plane. The Cloud OpenAPI has no query-execution operation.
- tool: list_databases
  reason: Reads SHOW DATABASES from the database itself. The Cloud OpenAPI manages services, not schemas.
- tool: list_tables
  reason: Reads table + column metadata from system tables in the database. No control-plane operation exposes schema.

specification: Well-Known Documents
specificationVersion: '0.1'
provider: ClickHouse
providerId: clickhouse
generated: '2026-09-19'
method: probed
source: live GET probes of /.well-known/* on every host in apis.yml, every OpenAPI servers[] host, the
  docs/console host, and the authorization server named by the MCP protected-resource document
note: 'clickhouse.com serves a real security.txt and a real RFC 9727 api-catalog linkset (the linkset
  points at https://api.clickhouse.cloud/v1 as service-desc, which is the live ClickHouse Cloud OpenAPI).
  api.clickhouse.cloud serves no /.well-known/* documents. clickhouse.cloud and console.clickhouse.cloud
  answer 200 with the same 5,990-byte SPA shell for EVERY /.well-known/* path — that is a catch-all, not
  a document, and is recorded as a miss. mcp.clickhouse.cloud is its own OAuth authorization server and
  serves both RFC 9728 protected-resource metadata (including a per-resource variant at /.well-known/oauth-protected-resource/mcp)
  and RFC 8414 authorization-server metadata.


  MCP-host OAuth discovery added 2026-09-19 (roadmap#321/#337): the harvest visits a provider''s primary
  hosts, and RFC 9728 protected-resource metadata lives on the MCP host, so these documents existed and
  were invisible to the scorer. Fetched live and validated on `resource`/`issuer`; one negative control
  per host.'
